[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recall"
version = "0.3.1"
description = "A local knowledge base built from Claude Code, Codex, OpenCode, and Pi conversations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["recall", "session-search", "coding-agents", "pi", "claude-code", "codex", "opencode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
semantic = [
  "fastembed>=0.3",
  "numpy>=1.24",
]

[project.scripts]
recall = "recall:main"

[tool.setuptools]
py-modules = ["recall"]
packages = ["recall_core"]
