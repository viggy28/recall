name: Retrieval CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine retrieval scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--labels-json "$LABELS_JSON")
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            args+=(--force)
          else
            args+=(--base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          # Once the detector exists on the base branch, execute that trusted
          # version. This PR's first rollout falls back to the checked-out copy.
          if git show "$BASE_SHA:scripts/ci/retrieval_scope.py" >/tmp/retrieval_scope.py 2>/dev/null; then
            python3 /tmp/retrieval_scope.py "${args[@]}"
          else
            python3 scripts/ci/retrieval_scope.py "${args[@]}"
          fi

  retrieval:
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECALL_EMBED_CACHE: ~/.cache/recall-fastembed
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmarks/retrieval/requirements-ci.txt

      - name: Cache pinned semantic model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/recall-fastembed
          key: retrieval-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmarks/retrieval/requirements-ci.txt', 'benchmarks/retrieval/semantic-model.json') }}

      - name: Install retrieval dependencies
        run: |
          python -m pip install -r benchmarks/retrieval/requirements-ci.txt
          python -m pip install -e .

      - name: Run retrieval contract tests
        run: python -m unittest discover -v -s tests/retrieval -t .

      - name: Run 1K retrieval smoke evaluation
        run: >-
          python -m benchmarks.retrieval.evaluate
          --profile pr --sessions 1000 --semantic
          --output-dir artifacts/retrieval-pr

      - name: Add evaluation summary
        if: always()
        run: |
          if [[ -f artifacts/retrieval-pr/summary.md ]]; then
            cat artifacts/retrieval-pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload retrieval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retrieval-pr-${{ github.run_id }}
          path: artifacts/retrieval-pr/
          retention-days: 14
          if-no-files-found: error

  gate:
    name: Required retrieval gate
    if: always()
    needs: [detect-changes, retrieval]
    runs-on: ubuntu-latest
    steps:
      - name: Validate retrieval outcome
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          SHOULD_RUN: ${{ needs.detect-changes.outputs.run }}
          RETRIEVAL_RESULT: ${{ needs.retrieval.result }}
          REASON: ${{ needs.detect-changes.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Detection: $DETECT_RESULT; requested: $SHOULD_RUN; retrieval: $RETRIEVAL_RESULT"
          echo "Reason: $REASON"
          if [[ "$DETECT_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$RETRIEVAL_RESULT" == "success" ]]; then
            exit 0
          fi
          if [[ "$SHOULD_RUN" == "false" && "$RETRIEVAL_RESULT" == "skipped" ]]; then
            exit 0
          fi
          exit 1
