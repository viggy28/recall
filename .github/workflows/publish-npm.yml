name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or verify, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish tagged release to npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [[ -z "$tag" ]]; then
            echo "A release tag is required" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Run Python tests
        run: python3 -m unittest -v

      - name: Compile Python module
        run: python3 -m py_compile recall.py

      - name: Install TypeScript check dependencies
        run: >-
          npm install --no-save --ignore-scripts
          typescript @types/node
          @earendil-works/pi-ai @earendil-works/pi-agent-core
          @earendil-works/pi-coding-agent @earendil-works/pi-tui typebox

      - name: Type check Pi extension
        run: npx tsc --project tsconfig.recall.json

      - name: Validate tag and manifest versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "release tag must be v<semver>; got $tag" >&2
            exit 1
          fi
          pkg_version="$(node -p "require('./package.json').version")"
          py_version="$(python3 -c "import re, pathlib; text = pathlib.Path('pyproject.toml').read_text(); m = re.search(r'^version\\s*=\\s*\\\"([^\\\"]+)\\\"', text, re.M); print(m.group(1) if m else '')")"
          if [[ -z "$py_version" || "$version" != "$pkg_version" || "$version" != "$py_version" ]]; then
            echo "tag=$tag package.json=$pkg_version pyproject.toml=$py_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack and inspect exact release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-package.mjs pack | tee pack.json
          filename="$(node -p "JSON.parse(require('fs').readFileSync('pack.json','utf8')).filename")"
          integrity="$(node -p "JSON.parse(require('fs').readFileSync('pack.json','utf8')).integrity")"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Check for an existing published artifact
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          expected_integrity="${{ steps.pack.outputs.integrity }}"
          if npm view "recall-pi@$version" version dist.integrity dist.tarball --json >/tmp/recall-existing.json 2>/dev/null; then
            actual_integrity="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/recall-existing.json','utf8'))['dist.integrity']")"
            if [[ "$actual_integrity" != "$expected_integrity" ]]; then
              echo "recall-pi@$version already exists with a different integrity" >&2
              cat /tmp/recall-existing.json >&2
              exit 1
            fi
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm provenance
        if: steps.existing.outputs.already == 'false'
        shell: bash
        run: npm publish "${{ steps.pack.outputs.filename }}" --provenance --access public --json | tee publish.json

      - name: Verify npm registry read-back
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          integrity="${{ steps.pack.outputs.integrity }}"
          for attempt in {1..24}; do
            if npm view "recall-pi@$version" version dist.integrity dist.tarball --json >/tmp/recall-npm-view.json 2>/dev/null; then
              cat /tmp/recall-npm-view.json
              node scripts/verify-published-package.mjs "$version" "$integrity"
              exit 0
            fi
            sleep 5
          done
          echo "recall-pi@$version was not visible on npm after polling" >&2
          exit 1
