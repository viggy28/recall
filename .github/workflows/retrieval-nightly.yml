name: Retrieval Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sessions:
        description: Corpus size to evaluate
        required: true
        default: both
        type: choice
        options: [both, '10000', '100000']

permissions:
  contents: read

concurrency:
  group: retrieval-nightly
  cancel-in-progress: true

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        sessions: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.sessions != 'both' && format('[{0}]', inputs.sessions) || '[10000,100000]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RECALL_EMBED_CACHE: ~/.cache/recall-fastembed
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmarks/retrieval/requirements-ci.txt

      - name: Cache pinned semantic model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/recall-fastembed
          key: retrieval-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmarks/retrieval/requirements-ci.txt', 'benchmarks/retrieval/semantic-model.json') }}

      - name: Install retrieval dependencies
        run: |
          python -m pip install -r benchmarks/retrieval/requirements-ci.txt
          python -m pip install -e .

      - name: Evaluate retrieval at scale
        run: >-
          python -m benchmarks.retrieval.evaluate
          --profile nightly --sessions ${{ matrix.sessions }} --semantic
          --output-dir artifacts/retrieval-${{ matrix.sessions }}

      - name: Add evaluation summary
        if: always()
        run: |
          if [[ -f artifacts/retrieval-${{ matrix.sessions }}/summary.md ]]; then
            cat artifacts/retrieval-${{ matrix.sessions }}/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retrieval-nightly-${{ matrix.sessions }}-${{ github.run_id }}
          path: |
            artifacts/retrieval-${{ matrix.sessions }}/results.json
            artifacts/retrieval-${{ matrix.sessions }}/summary.md
          retention-days: 30
          if-no-files-found: error
