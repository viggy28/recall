name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test, typecheck, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Run Python tests
        run: python3 -m unittest -v

      - name: Compile Python module
        run: python3 -m py_compile recall.py

      - name: Install TypeScript check dependencies
        run: >-
          npm install --no-save --ignore-scripts
          typescript @types/node
          @earendil-works/pi-ai @earendil-works/pi-agent-core
          @earendil-works/pi-coding-agent @earendil-works/pi-tui typebox

      - name: Type check Pi extension
        run: npx tsc --project tsconfig.recall.json

      - name: Inspect npm package dry run
        run: node scripts/verify-package.mjs dry-run
